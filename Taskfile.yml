# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    desc: Show available tasks
    summary: |
      Lists public tasks.
      For machine-readable discovery, use: task --list --json
    cmds:
      - task --list

  build:
    desc: Build the workspace
    summary: |
      Builds the workspace with Cargo using the lockfile as-is.
    cmds:
      - cargo build --workspace --locked

  build:release:
    desc: Build optimized artifacts
    summary: |
      Builds the workspace in release mode.
    cmds:
      - cargo build --workspace --release --locked

  package:
    desc: Build installable extension package directories
    summary: |
      Builds release binaries and writes installable packages under packages/<id>/.
    cmds:
      - task: build:release
      - |
        set -eu
        rm -rf packages
        for extension_id in aerospace clock sketchybar workspace-indicator
        do
          install -d "packages/$extension_id/bin"
          install -m 0644 "extensions/$extension_id/extension.json" \
            "packages/$extension_id/extension.json"
          install -m 0755 "target/release/spindle-$extension_id" \
            "packages/$extension_id/bin/$extension_id"
        done
      - task: package:verify

  package:verify:
    desc: Verify installable extension package directories
    summary: |
      Verifies packages/<id>/ contains extension.json and executable bin/<id>.
    cmds:
      - |
        set -eu
        test -d packages
        expected="aerospace clock sketchybar workspace-indicator"
        for extension_id in $expected
        do
          manifest="packages/$extension_id/extension.json"
          binary="packages/$extension_id/bin/$extension_id"
          test -f "$manifest"
          test -f "$binary"
          test -x "$binary"
          grep -q '"id": "'$extension_id'"' "$manifest"
          grep -q '"runtime": "stdio-jsonl"' "$manifest"
          if grep -q '"entrypoint"' "$manifest"; then
            echo "$manifest must not contain legacy entrypoint" >&2
            exit 1
          fi
        done
        for package_dir in packages/*
        do
          test -d "$package_dir" || continue
          package_name=${package_dir##*/}
          case " $expected " in
            *" $package_name "*) ;;
            *) echo "unexpected package directory: $package_name" >&2; exit 1 ;;
          esac
        done

  test:
    desc: Run all tests
    summary: |
      Runs unit, integration, and documentation tests across the workspace.
    cmds:
      - cargo test --workspace --all-targets --all-features --locked

  doc:
    desc: Build documentation
    summary: |
      Builds documentation for the workspace without dependency docs.
    cmds:
      - cargo doc --workspace --no-deps

  lint:
    desc: Run Clippy
    summary: |
      Runs Clippy across the workspace and treats warnings as errors.
      Pedantic, nursery, and cargo lint groups are enabled from crate roots.
      Thresholds: clippy.toml. Levels: Cargo.toml and crate Cargo.toml lints.
    cmds:
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  fmt:check:
    desc: Check formatting
    summary: |
      Verifies Rust formatting without modifying files.
      Uses the repo toolchain (nightly) so rustfmt.toml unstable options apply.
    cmds:
      - cargo fmt --all -- --check

  fmt:fix:
    aliases: [fmt]
    desc: Format code
    summary: |
      Formats all Rust sources in the workspace (nightly rustfmt; see rustfmt.toml).
    cmds:
      - cargo fmt --all

  clean:
    desc: Remove build artifacts
    summary: |
      Removes Cargo build artifacts.
    cmds:
      - cargo clean

  install:lefthook:
    internal: true
    desc: Install git hooks if needed
    summary: |
      Ensures lefthook hooks are installed.
      Requires lefthook to be installed and available on PATH.
    preconditions:
      - sh: command -v lefthook >/dev/null 2>&1
        msg: "lefthook is not installed. Please install it first."
    status:
      - test -f .git/hooks/pre-commit
      - grep -q lefthook .git/hooks/pre-commit
    cmds:
      - lefthook install

  check:fast:
    desc: Run fast local verification
    summary: |
      Runs formatting checks, linting, and a normal build.
    deps:
      - task: install:lefthook
        silent: true
    cmds:
      - task: fmt:check
      - task: lint
      - task: build

  check:full:
    aliases: [check]
    desc: Run full verification
    summary: |
      Runs formatting checks, linting, tests, documentation build, and build.
    deps:
      - task: install:lefthook
        silent: true
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: doc
      - task: build
