[workspace]
members = [
    "extensions/aerospace",
    "extensions/sketchybar",
    "extensions/workspace-indicator",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/shuymn/spindle-extensions"

[workspace.dependencies]
anyhow = "1.0.102"
cc = "1.2.49"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
spindle-extension-sdk = { git = "https://github.com/shuymn/spindle", branch = "main", package = "spindle-extension-sdk" }
tempfile = "3.23.0"
thiserror = "2.0.18"
